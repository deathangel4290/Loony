name: Deploy to GitHub Pages

# Builds the release game, runs the test suite, and publishes dist/ to Pages.
# Requires Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
on:
  push:
    branches: [claude/mobile-car-game, main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # If Pages is still set to "Deploy from a branch", GitHub also publishes
      # the raw source on every push. Wait for that to finish so the compiled
      # game is always the last (live) deployment. No-op once the source is
      # set to "GitHub Actions".
      - name: Wait for legacy branch-based Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 45); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}" \
              --jq '[.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment" and .status != "completed")] | length' || echo 0)
            if [ "$n" = "0" ]; then break; fi
            echo "Legacy Pages build still running ($n); waiting..."
            sleep 10
          done
      - id: deployment
        uses: actions/deploy-pages@v4
